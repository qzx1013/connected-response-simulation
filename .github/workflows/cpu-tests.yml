name: CPU correctness and portability
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c requirements-tested.txt '.[test]'
      - run: residual-tn validate
      - run: ruff check src tests
      - run: python -m pytest -q
      - run: residual-tn plan fig6
